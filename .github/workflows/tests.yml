name: Browser Tests

on:
  push:
    branches: [LWB-with-Bugs, main]
  pull_request:
    branches: [LWB-with-Bugs, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build for GitHub Pages
        run: npm run build

      - name: Start local server
        run: npx serve -l 3000 &
        sleep 3

      - name: Run browser tests with Puppeteer
        run: |
          node << 'EOF'
          const puppeteer = require('puppeteer');
          
          (async () => {
            const browser = await puppeteer.launch({
              headless: 'new',
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            const page = await browser.newPage();
            
            // Capture console messages
            const consoleLogs = [];
            page.on('console', msg => consoleLogs.push(msg.text()));
            
            // Capture errors
            page.on('pageerror', err => consoleLogs.push('PAGE ERROR: ' + err.message));
            
            try {
              await page.goto('http://localhost:3000', { waitUntil: 'networkidle0', timeout: 30000 });
              await page.waitForTimeout(2000);
              
              // Run tests
              const result = await page.evaluate(async () => {
                try {
                  const tests = await import('./js/tests.js');
                  const results = await tests.runTests();
                  return results;
                } catch (e) {
                  return { error: e.message };
                }
              });
              
              console.log('=== TEST RESULTS ===');
              console.log(JSON.stringify(result, null, 2));
              
              // Check for errors
              const errors = consoleLogs.filter(log => 
                log.includes('Error') || log.includes('error') || log.includes('Uncaught')
              );
              
              if (errors.length > 0) {
                console.log('\n=== CONSOLE ERRORS ===');
                errors.forEach(e => console.log(e));
              }
              
              if (result && result.summary && result.summary.failed > 0) {
                process.exit(1);
              }
            } catch (e) {
              console.error('Test failed:', e.message);
              process.exit(1);
            } finally {
              await browser.close();
            }
          })();
          EOF